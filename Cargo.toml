[package]
name = "ext-proc-load-tester"
version = "0.1.37"
edition = "2024"
description = "A load testing tool for Envoy external processing servers"
license = "MIT"
repository = "https://github.com/bonnetn/ext-proc-load-tester"
readme = "README.md"
keywords = ["load-testing", "envoy", "grpc", "performance"]
categories = ["development-tools", "web-programming"]
publish = false

[dependencies]
clap = { version = "4.6.7", features = ["derive"] }
futures = "0.3.34"
indicatif = "0.18.6"
prost = "0.14.4"
prost-types = "0.14.4"
thiserror = "2.0.21"
tokio = { version = "1.54.1", features = ["full", "test-util"] }
tokio-stream = "0.1.19"
tokio-util = "0.7.20"
tonic = "0.14.9"
tonic-prost = "0.14.9"

[build-dependencies]
tonic-build = "0.14.9"
tonic-prost-build = "0.14.9"
